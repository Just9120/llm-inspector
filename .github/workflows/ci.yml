name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-validation:
    name: windows-go
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Verify Go contracts
        shell: pwsh
        run: ./scripts/validate-go.ps1

  validation:
    name: windows-dotnet
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Record toolchain
        run: dotnet --info

      - name: Restore locked dependency graph
        run: dotnet restore LlmInspector.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format LlmInspector.slnx --verify-no-changes --no-restore

      - name: Build release configuration
        run: dotnet build LlmInspector.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test LlmInspector.slnx -c Release --no-build --logger "console;verbosity=minimal"

      - name: Restore locked win-x64 graph
        run: dotnet restore src/LlmInspector.App/LlmInspector.App.csproj --locked-mode -r win-x64

      - name: Publish self-contained win-x64 shell
        run: dotnet publish src/LlmInspector.App/LlmInspector.App.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/win-x64

      - name: Smoke-test Avalonia initialization
        run: .\artifacts\win-x64\LlmInspector.App.exe --smoke-test
