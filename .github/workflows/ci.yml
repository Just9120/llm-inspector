name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-validation:
    name: windows-go
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pinned npm on ephemeral runner
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath .npm-version -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid npm pin.' }
          npm install --global "npm@$version" --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Go, frontend and exact Windows executable
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Validate local release packaging without publishing
        shell: pwsh
        run: ./eng/release/Test-ReleaseTools.ps1
