name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build-portable-win-x64
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      source-created-at: ${{ steps.release.outputs.source-created-at }}
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Checkout exact tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate trusted final tag and main ancestry
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tagMatch = [regex]::Match(
            $env:RELEASE_TAG,
            '^v(?<major>0|[1-9][0-9]*)\.(?<minor>0|[1-9][0-9]*)\.(?<patch>0|[1-9][0-9]*)$')
          if (-not $tagMatch.Success) {
            throw 'Release tag must be an exact final SemVer value prefixed with v; prerelease tags are not published.'
          }
          $remoteRef = 'refs/remotes/origin/main'
          git fetch --no-tags origin "main:${remoteRef}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git merge-base --is-ancestor $env:SOURCE_SHA $remoteRef
          if ($LASTEXITCODE -ne 0) {
            throw 'Tagged revision is not reachable from origin/main.'
          }
          $version = $env:RELEASE_TAG.Substring(1)
          $created = git show -s --format=%cI $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($created)) {
            throw 'Cannot resolve the tagged source timestamp.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "source-created-at=$created" >> $env:GITHUB_OUTPUT

      - name: Install pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pinned npm on ephemeral runner
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath .npm-version -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid npm pin.' }
          npm install --global "npm@$version" --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate and build exact Windows executable once
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $config = Get-Content -LiteralPath wails.json -Raw | ConvertFrom-Json
          if ($config.info.productVersion -ne $env:RELEASE_VERSION) { throw 'Tag differs from reviewed product version.' }
          ./scripts/build-windows.ps1

      - name: Create checksum, SBOM, manifest and release notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_CREATED_AT: ${{ steps.release.outputs.source-created-at }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          .\eng\release\New-ReleasePayload.ps1 `
            -PublishDirectory .\build\bin `
            -OutputDirectory .\artifacts\release-payload `
            -Version $env:RELEASE_VERSION `
            -SourceSha $env:SOURCE_SHA `
            -Repository $env:SOURCE_REPOSITORY `
            -SourceCreatedAt $env:SOURCE_CREATED_AT

      - name: Verify release payload
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: .\eng\release\Test-ReleasePayload.ps1 -PayloadDirectory .\artifacts\release-payload -Version $env:RELEASE_VERSION -SourceSha $env:SOURCE_SHA

      - name: Upload exact release payload
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-payload-${{ github.sha }}
          path: artifacts/release-payload
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: attest-and-publish-github-release
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download exact build payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-payload-${{ github.sha }}
          path: release-payload

      - name: Revalidate immutable payload
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_VERSION -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Build output version is invalid.'
          }
          $assets = Resolve-Path -LiteralPath .\release-payload\assets
          $checksumLines = @(Get-Content -LiteralPath (Join-Path $assets 'SHA256SUMS.txt'))
          if ($checksumLines.Count -ne 3) { throw 'Unexpected checksum subject count.' }
          foreach ($line in $checksumLines) {
            if ($line -notmatch '^(?<hash>[0-9a-f]{64}) \*(?<name>[A-Za-z0-9_.-]+)$') {
              throw 'Invalid checksum entry.'
            }
            $path = Join-Path $assets $Matches.name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Checksum subject is missing.' }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches.hash) { throw 'Checksum mismatch.' }
          }
          $manifestPath = Join-Path $assets "LlmInspector-$env:RELEASE_VERSION-win-x64.release.json"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.source_sha -ne $env:SOURCE_SHA -or $manifest.version -ne $env:RELEASE_VERSION) {
            throw 'Downloaded payload identity does not match the workflow revision.'
          }

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-payload/assets/SHA256SUMS.txt

      - name: Attest executable SBOM
        id: sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release-payload/assets/LlmInspector-${{ needs.build.outputs.version }}-win-x64.exe
          sbom-path: release-payload/assets/LlmInspector-${{ needs.build.outputs.version }}-win-x64.spdx.json

      - name: Add downloadable attestation bundles
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          Copy-Item -LiteralPath $env:PROVENANCE_BUNDLE -Destination ".\release-payload\assets\LlmInspector-$env:RELEASE_VERSION-win-x64.provenance.sigstore.json"
          Copy-Item -LiteralPath $env:SBOM_BUNDLE -Destination ".\release-payload\assets\LlmInspector-$env:RELEASE_VERSION-win-x64.sbom.sigstore.json"

      - name: Publish immutable final GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -ne "v$env:RELEASE_VERSION") { throw 'Release tag/version identity mismatch.' }
          $assetNames = @(
            "LlmInspector-$env:RELEASE_VERSION-win-x64.exe",
            "LlmInspector-$env:RELEASE_VERSION-win-x64.release.json",
            "LlmInspector-$env:RELEASE_VERSION-win-x64.spdx.json",
            "LlmInspector-$env:RELEASE_VERSION-win-x64.provenance.sigstore.json",
            "LlmInspector-$env:RELEASE_VERSION-win-x64.sbom.sigstore.json",
            'SHA256SUMS.txt'
          )
          $assetPaths = @($assetNames | ForEach-Object { Join-Path .\release-payload\assets $_ })
          $arguments = @(
            'release', 'create', $env:RELEASE_TAG,
            '--verify-tag',
            '--title', "LLM Inspector $env:RELEASE_TAG",
            '--notes-file', '.\release-payload\release-notes.md'
          )
          $arguments += $assetPaths
          gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
