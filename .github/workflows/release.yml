name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build-portable-win-x64
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      source-created-at: ${{ steps.release.outputs.source-created-at }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Checkout exact tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate trusted tag and main ancestry
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
            throw 'Release tag must be an exact SemVer value prefixed with v.'
          }
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git merge-base --is-ancestor $env:SOURCE_SHA refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Tagged revision is not reachable from origin/main.' }
          $version = $env:RELEASE_TAG.Substring(1)
          $created = git show -s --format=%cI $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($created)) {
            throw 'Cannot resolve the tagged source timestamp.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "source-created-at=$created" >> $env:GITHUB_OUTPUT

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Record toolchain
        run: dotnet --info

      - name: Restore locked dependency graph
        run: dotnet restore LlmInspector.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format LlmInspector.slnx --verify-no-changes --no-restore

      - name: Build release configuration
        run: dotnet build LlmInspector.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test LlmInspector.slnx -c Release --no-build --logger "console;verbosity=minimal"

      - name: Restore locked win-x64 graph
        run: dotnet restore src/LlmInspector.App/LlmInspector.App.csproj --locked-mode -r win-x64

      - name: Publish exact portable executable once
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: dotnet publish src/LlmInspector.App/LlmInspector.App.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/publish -p:Version=$env:RELEASE_VERSION

      - name: Verify single-file launch
        run: .\artifacts\publish\LlmInspector.App.exe --smoke-test

      - name: Create checksum, SBOM, manifest and release notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_CREATED_AT: ${{ steps.release.outputs.source-created-at }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          .\eng\release\New-ReleasePayload.ps1 `
            -PublishDirectory .\artifacts\publish `
            -AssetsFile .\src\LlmInspector.App\obj\project.assets.json `
            -OutputDirectory .\artifacts\release-payload `
            -Version $env:RELEASE_VERSION `
            -SourceSha $env:SOURCE_SHA `
            -Repository $env:SOURCE_REPOSITORY `
            -SourceCreatedAt $env:SOURCE_CREATED_AT

      - name: Verify release payload
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: .\eng\release\Test-ReleasePayload.ps1 -PayloadDirectory .\artifacts\release-payload -Version $env:RELEASE_VERSION -SourceSha $env:SOURCE_SHA

      - name: Upload exact release payload
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-payload-${{ github.sha }}
          path: artifacts/release-payload
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: attest-and-publish-github-release
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download exact build payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-payload-${{ github.sha }}
          path: release-payload

      - name: Revalidate immutable payload
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_VERSION -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
            throw 'Build output version is invalid.'
          }
          $assets = Resolve-Path -LiteralPath .\release-payload\assets
          $checksumLines = @(Get-Content -LiteralPath (Join-Path $assets 'SHA256SUMS.txt'))
          if ($checksumLines.Count -ne 3) { throw 'Unexpected checksum subject count.' }
          foreach ($line in $checksumLines) {
            if ($line -notmatch '^(?<hash>[0-9a-f]{64}) \*(?<name>[A-Za-z0-9_.-]+)$') {
              throw 'Invalid checksum entry.'
            }
            $path = Join-Path $assets $Matches.name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Checksum subject is missing.' }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches.hash) { throw 'Checksum mismatch.' }
          }
          $manifestPath = Join-Path $assets "LlmInspector-$env:RELEASE_VERSION-win-x64.release.json"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.source_sha -ne $env:SOURCE_SHA -or $manifest.version -ne $env:RELEASE_VERSION) {
            throw 'Downloaded payload identity does not match the workflow revision.'
          }

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-payload/assets/SHA256SUMS.txt

      - name: Attest executable SBOM
        id: sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release-payload/assets/LlmInspector-${{ needs.build.outputs.version }}-win-x64.exe
          sbom-path: release-payload/assets/LlmInspector-${{ needs.build.outputs.version }}-win-x64.spdx.json

      - name: Add downloadable attestation bundles
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          Copy-Item -LiteralPath $env:PROVENANCE_BUNDLE -Destination ".\release-payload\assets\LlmInspector-$env:RELEASE_VERSION-win-x64.provenance.sigstore.json"
          Copy-Item -LiteralPath $env:SBOM_BUNDLE -Destination ".\release-payload\assets\LlmInspector-$env:RELEASE_VERSION-win-x64.sbom.sigstore.json"

      - name: Publish immutable GitHub prerelease or release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -ne "v$env:RELEASE_VERSION") { throw 'Release tag/version identity mismatch.' }
          $assetNames = @(
            "LlmInspector-$env:RELEASE_VERSION-win-x64.exe",
            "LlmInspector-$env:RELEASE_VERSION-win-x64.release.json",
            "LlmInspector-$env:RELEASE_VERSION-win-x64.spdx.json",
            "LlmInspector-$env:RELEASE_VERSION-win-x64.provenance.sigstore.json",
            "LlmInspector-$env:RELEASE_VERSION-win-x64.sbom.sigstore.json",
            'SHA256SUMS.txt'
          )
          $assetPaths = @($assetNames | ForEach-Object { Join-Path .\release-payload\assets $_ })
          $arguments = @(
            'release', 'create', $env:RELEASE_TAG,
            '--verify-tag',
            '--title', "LLM Inspector $env:RELEASE_TAG",
            '--notes-file', '.\release-payload\release-notes.md'
          )
          if ($env:IS_PRERELEASE -eq 'true') { $arguments += '--prerelease' }
          $arguments += $assetPaths
          gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
